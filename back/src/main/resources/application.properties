spring.config.import=optional:file:./.env[.properties]

spring.application.name=mequijunto
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

security.jwt.secret=${JWT_SECRET}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
integracao.whatsapp.api-key=${WHATSAPP_API_KEY:}

bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
bootstrap.admin.nome=${BOOTSTRAP_ADMIN_NOME:}
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
bootstrap.admin.perfil=${BOOTSTRAP_ADMIN_PERFIL:RH}
bootstrap.admin.telefone=${BOOTSTRAP_ADMIN_TELEFONE:}
