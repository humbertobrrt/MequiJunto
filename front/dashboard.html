<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MéquiJunto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #eeeeee;
            color: #000;
            min-height: 100vh;
            display: flex;
        }

        /* ---------- Sidebar ---------- */
        .sidebar {
            width: 200px;
            flex-shrink: 0;
            background-color: #da291c;
            padding: 36px 20px 24px 10px;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .sidebar-logo {
            display: flex;
            justify-content: center;
            margin: 0 0 56px 10px;
        }

        .sidebar-logo img {
            width: 90px;
            height: auto;
        }

        .menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .menu a,
        .menu button {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 9px 14px 9px 36px;
            border: none;
            background: transparent;
            border-radius: 8px;
            color: #fff;
            font-family: 'DM Sans', 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            text-align: left;
            transition: background 0.15s;
        }

        .menu a:hover,
        .menu button:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .menu a.active {
            background: #ffc400;
            color: #000;
            padding-left: 36px;
        }

        .menu svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            flex-shrink: 0;
            margin-left: -26px;
        }

        /* ---------- Conteúdo ---------- */
        .main {
            flex: 1;
            min-width: 0;
            padding: 22px 28px 28px 24px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
        }

        .greeting {
            font-family: 'DM Sans', 'Inter', sans-serif;
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 0.3px;
            margin-left: 22px;
            margin-top: 6px;
            line-height: 1.15;
        }

        .user {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-info {
            text-align: right;
            line-height: 1.25;
        }

        .user-info strong {
            display: block;
            font-size: 13px;
            font-weight: 500;
        }

        .user-info span {
            font-size: 11px;
            color: #8a8a8a;
        }

        .avatar-top {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 2px solid #222;
            background: #f4a261;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .avatar-top svg {
            width: 42px;
            height: 42px;
            fill: #fff;
        }

        /* Resumo (dados vindos da API) */
        .kpis {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 0 0 14px 4px;
        }

        .kpi {
            background: #fffdf0;
            border: 1px solid #8f8f8f;
            border-radius: 12px;
            padding: 8px 14px;
            min-width: 130px;
            text-align: center;
        }

        .kpi h3 {
            font-size: 11px;
            font-weight: 500;
            color: #555;
            margin-bottom: 2px;
        }

        .kpi p {
            font-family: 'DM Sans', 'Inter', sans-serif;
            font-size: 20px;
            font-weight: 800;
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1.8fr) minmax(0, 1fr);
            gap: 16px;
            align-items: stretch;
        }

        .left-col {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card {
            background: #fffdf0;
            border: 1px solid #7b7b7b;
            border-radius: 18px;
        }

        /* Gráfico */
        .chart-card {
            padding: 22px 26px 16px;
            flex: 1;
        }

        .chart-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
        }

        .periodo {
            border: 1px solid #999;
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 11px;
            color: #888;
            background: transparent;
        }

        .periodo select {
            border: none;
            background: transparent;
            font-size: 11px;
            color: #000;
            outline: none;
            cursor: pointer;
        }

        #grafico {
            width: 100%;
            height: auto;
            margin-top: 14px;
            display: block;
        }

        /* Alertas recentes */
        .recent-card {
            padding: 28px 20px 24px;
        }

        .recent-card .card-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 20px;
            margin-left: 2px;
        }

        .alert-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .alert-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #fffdf0;
            font-size: 12.5px;
        }

        .alert-item.destaque {
            border: 2px solid #e5261b;
        }

        .alert-item .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #e5261b;
            flex-shrink: 0;
        }

        .alert-item .nome {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .alert-item .data {
            font-weight: 700;
            font-size: 12px;
        }

        /* Colaborador com mais alertas */
        .top-card {
            position: relative;
            display: flex;
            align-items: stretch;
            justify-content: space-between;
            background: #fffdf0;
            border: 1px solid #f5c26b;
            border-radius: 14px;
            padding: 12px 0 0 42px;
            min-height: 96px;
            margin-left: 0;
        }

        .pin {
            position: absolute;
            top: -10px;
            left: -6px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #fffdf0;
            border: 1.5px solid #e5261b;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pin svg {
            width: 22px;
            height: 22px;
            fill: #e5261b;
            transform: rotate(30deg);
        }

        .top-info h3 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .top-person {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 600;
            margin-left: -2px;
        }

        .avatar-grande {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #a9a9a9;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .avatar-grande svg {
            width: 48px;
            height: 48px;
            fill: #fff;
        }

        .total-box {
            background: #ffbd59;
            border-radius: 18px 0 14px 18px;
            width: 115px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 0;
            padding: 8px 6px;
            align-self: stretch;
            border-top-right-radius: 0;
        }

        .total-box span {
            font-size: 12px;
            font-weight: 600;
            text-align: center;
        }

        .total-box strong {
            font-family: 'DM Sans', 'Inter', sans-serif;
            font-size: 34px;
            font-weight: 500;
            line-height: 1.2;
        }


        /* Top 3 colaboradores */
        .top-card { padding: 12px 16px 14px 42px; }
        .top-info { flex: 1; min-width: 0; }
        .top-lista { display: flex; flex-wrap: wrap; gap: 12px 26px; }
        .top-item { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .top-item .avatar-grande { width: 46px; height: 46px; }
        .top-item .avatar-grande svg { width: 38px; height: 38px; }
        .top-item strong { display: block; font-size: 14px; max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .top-item small { display: inline-block; margin-top: 3px; padding: 1px 10px; border-radius: 12px; background: #ffbd59; font-size: 12px; font-weight: 700; }
        .top-vazio { font-size: 14px; color: #777; }

        /* ---------- Interações ---------- */
        a:focus-visible, button:focus-visible, select:focus-visible,
        [tabindex]:focus-visible {
            outline: 3px solid #1a73e8;
            outline-offset: 2px;
        }

        .kpi[data-href] { cursor: pointer; transition: transform .15s, box-shadow .15s, background .15s; }
        .kpi[data-href]:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,.12); background: #fff8cf; }

        .card { transition: box-shadow .2s; }
        .card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.10); }

        .chart-card { position: relative; }
        #grafico { cursor: crosshair; }
        .periodo select { padding: 2px 4px; border-radius: 6px; }
        .periodo:hover { border-color: #444; background: #fff; }

        .tooltip {
            position: absolute;
            pointer-events: none;
            background: #222;
            color: #fff;
            font-size: 12px;
            line-height: 1.35;
            padding: 6px 10px;
            border-radius: 8px;
            transform: translate(-50%, -100%);
            white-space: nowrap;
            opacity: 0;
            transition: opacity .12s;
            z-index: 5;
        }
        .tooltip.visivel { opacity: 1; }

        @keyframes desenhar { to { stroke-dashoffset: 0; } }

        .alert-item {
            cursor: pointer;
            transition: transform .15s, box-shadow .15s, background .15s;
        }
        .alert-item:hover {
            transform: translateX(-3px);
            box-shadow: 0 3px 8px rgba(0,0,0,.15);
            background: #fff6c9;
        }
        .alert-item.lido { opacity: .65; }
        .alert-item.lido .dot { background: #aaa; }

        .recent-acoes {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 18px;
            font-size: 12px;
        }
        .recent-acoes a, .recent-acoes button {
            color: #000;
            background: none;
            border: none;
            font-size: 12px;
            font-weight: 600;
            text-decoration: underline;
            cursor: pointer;
        }
        .recent-acoes a:hover, .recent-acoes button:hover { color: #da291c; }

        .top-card { cursor: pointer; transition: transform .15s, box-shadow .15s; }
        .top-card:hover { transform: translateY(-2px); box-shadow: 0 5px 14px rgba(245,194,107,.55); }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.5);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 50;
        }
        .modal-overlay[hidden] { display: none; }
        .modal {
            position: relative;
            background: #fffdf0;
            border: 1px solid #7b7b7b;
            border-radius: 18px;
            width: 100%;
            max-width: 420px;
            padding: 28px 26px 22px;
            box-shadow: 0 12px 40px rgba(0,0,0,.3);
            animation: surgir .18s ease;
        }
        @keyframes surgir { from { opacity: 0; transform: translateY(10px) scale(.98); } }
        .modal h2 {
            font-family: 'DM Sans', 'Inter', sans-serif;
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 14px;
            padding-right: 28px;
        }
        .modal-x {
            position: absolute;
            top: 12px;
            right: 14px;
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: transparent;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
        }
        .modal-x:hover { background: rgba(0,0,0,.08); }
        .modal-corpo { font-size: 14px; line-height: 1.5; }
        .modal-corpo p { margin-bottom: 10px; }
        .modal-corpo ul { margin: 0 0 10px 18px; }
        .modal-corpo li { margin-bottom: 4px; }
        .modal-linha { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid #ece6c4; }
        .modal-linha:last-of-type { border-bottom: none; }
        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }
        .badge.alto { background: #da291c; }
        .badge.medio { background: #f08a00; }
        .badge.baixo { background: #3a9d4a; }

        .modal-acoes {
            display: flex;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }
        .btn {
            padding: 9px 16px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #fff;
            color: #000;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: filter .15s, transform .1s;
        }
        .btn:hover { filter: brightness(.94); }
        .btn:active { transform: scale(.97); }
        .btn.primario { background: #da291c; border-color: #da291c; color: #fff; }
        .btn.amarelo { background: #ffc400; border-color: #ffc400; }

        .opcao {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #ece6c4;
            cursor: pointer;
        }
        .opcao input { width: 18px; height: 18px; accent-color: #da291c; cursor: pointer; }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translate(-50%, 20px);
            background: #222;
            color: #fff;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s, transform .2s;
            z-index: 60;
        }
        .toast.visivel { opacity: 1; transform: translate(-50%, 0); }

        /* Responsivo */
        @media (max-width: 1000px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 700px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                position: static;
                padding: 20px 14px;
            }
            .sidebar-logo {
                margin: 0 0 18px 0;
            }
            .sidebar-logo img {
                width: 60px;
            }
            .menu {
                flex-direction: row;
                flex-wrap: wrap;
            }
            .menu li {
                flex: 1 1 auto;
            }
            .menu a,
            .menu button {
                padding: 8px 12px;
                justify-content: center;
            }
            .menu svg {
                margin-left: 0;
            }
            .greeting {
                font-size: 32px;
                margin-left: 0;
            }
            .main {
                padding: 18px 14px;
            }
            .top-card {
                flex-direction: column;
                padding: 14px 14px 0 42px;
            }
            .total-box {
                width: auto;
                border-radius: 0 0 14px 14px;
                margin: 10px -14px 0 -42px;
            }
        }

    <script>
        const DEMO = new URLSearchParams(location.search).has("demo");

        /* ---------- Dados vindos de /api/alertas ---------- */
        const ROTULO_X = { "essa semana": "Dias da semana", "semana passada": "Dias da semana", "este mês": "Semanas do mês" };
        let PERIODOS = {};
        let alertasRecentes = [];
        let COLAB_TOP = []; // até 3 colaboradores com mais alertas

        function inicioSemana(d) {
            const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
            x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); // segunda-feira
            return x;
        }

        function nivelRotulo(n) {
            const v = String(n || "").toUpperCase();
            return ["ALTO", "ALTA", "CRITICO", "CRÍTICO"].includes(v) ? "Alto" : ["BAIXO", "BAIXA"].includes(v) ? "Baixo" : "Médio";
        }

        function montarDados(lista) {
            const hoje = new Date();
            const ini = inicioSemana(hoje);
            const nomes = ["SEG", "TER", "QUAR", "QUIN", "SEX", "SAB", "DOM"];
            const atual = nomes.map(dia => ({ dia, qtd: 0 }));
            const passada = nomes.map(dia => ({ dia, qtd: 0 }));
            const nSem = Math.ceil(new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0).getDate() / 7);
            const mes = Array.from({ length: nSem }, (_, i) => ({ dia: "SEM " + (i + 1), qtd: 0 }));

            lista.forEach(a => {
                const d = new Date(a.criadoEm);
                if (isNaN(d)) return;
                const diff = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - ini) / 86400000);
                if (diff >= 0 && diff < 7) atual[diff].qtd++;
                else if (diff < 0 && diff >= -7) passada[diff + 7].qtd++;
                if (d.getFullYear() === hoje.getFullYear() && d.getMonth() === hoje.getMonth()) mes[Math.floor((d.getDate() - 1) / 7)].qtd++;
            });
            PERIODOS = { "essa semana": atual, "semana passada": passada, "este mês": mes };

            const pad = n => String(n).padStart(2, "0");
            alertasRecentes = [...lista]
                .sort((x, y) => String(y.criadoEm).localeCompare(String(x.criadoEm)))
                .slice(0, 5)
                .map(a => {
                    const d = new Date(a.criadoEm);
                    return {
                        nome: a.nomeUsuario || "Colaborador",
                        data: isNaN(d) ? "--/--" : pad(d.getDate()) + "/" + pad(d.getMonth() + 1),
                        nivel: nivelRotulo(a.nivelRisco),
                        lido: String(a.statusAlerta).toUpperCase() === "RESOLVIDO",
                        descricao: a.analiseIa || a.conteudo || "Sem detalhes."
                    };
                });

            const cont = {};
            lista.forEach(a => {
                const k = a.usuarioId ?? a.nomeUsuario;
                if (!cont[k]) cont[k] = { nome: a.nomeUsuario || ("Colaborador #" + a.usuarioId), qtd: 0 };
                cont[k].qtd++;
            });
            COLAB_TOP = Object.values(cont)
                .sort((x, y) => y.qtd - x.qtd || x.nome.localeCompare(y.nome))
                .slice(0, 3);
        }

        function desenharTop() {
            const box = document.getElementById("topLista");
            box.innerHTML = "";
            if (!COLAB_TOP.length) { box.appendChild(criar("span", "top-vazio", "Nenhum alerta registrado.")); return; }
            COLAB_TOP.forEach((c, i) => {
                const item = criar("div", "top-item");
                const av = criar("div", "avatar-grande");
                av.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
                item.appendChild(av);
                const txt = criar("div", "");
                txt.appendChild(criar("strong", "", (i + 1) + "º " + c.nome));
                txt.appendChild(criar("small", "", c.qtd + (c.qtd === 1 ? " alerta" : " alertas")));
                item.appendChild(txt);
                box.appendChild(item);
            });
        }

        function atualizarPainelAlertas() {
            desenharGrafico(lerPref("animar", true));
            desenharAlertas();
            desenharTop();
        }

        async function carregarAlertasPainel(token) {
            try {
                const res = await fetch(MJ_API + "/api/alertas", { headers: { 'Authorization': `Bearer ${token}` } });
                if (!res.ok) throw new Error(res.status);
                montarDados(await res.json());
                atualizarPainelAlertas();
            } catch (e) {
                console.error("Erro ao carregar alertas:", e);
                toast("Não foi possível carregar os alertas.");
            }
        }

        function preencherUsuario() {
            const t = sessionStorage.getItem("token");
            if (!t) return;
            let p = {};
            try { p = JSON.parse(atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))); } catch (e) {}
            const roles = p.roles || [];
            setTexto("nomeUsuario", p.sub || "");
            setTexto("perfilUsuario", roles.includes("ROLE_GERENCIA") ? "Gerência" : roles.includes("ROLE_RH") ? "Recursos Humanos" : "");
        }

        /* ---------- Utilidades ---------- */
        function lerPref(chave, padrao) {
            try {
                const v = localStorage.getItem("mj_" + chave);
                return v === null ? padrao : v === "1";
            } catch (e) { return padrao; }
        }
        function salvarPref(chave, valor) {
            try { localStorage.setItem("mj_" + chave, valor ? "1" : "0"); } catch (e) {}
        }

        function criar(tag, classe, texto) {
            const el = document.createElement(tag);
            if (classe) el.className = classe;
            if (texto !== undefined) el.textContent = texto;
            return el;
        }

        function setTexto(id, valor) {
            const el = document.getElementById(id);
            if (el && valor !== undefined && valor !== null) el.innerText = valor;
        }

        let toastTimer;
        function toast(msg) {
            const t = document.getElementById("toast");
            t.textContent = msg;
            t.classList.add("visivel");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove("visivel"), 2200);
        }

        /* ---------- Modal ---------- */
        let ultimoFoco = null;

        function abrirModal(titulo, corpo, botoes) {
            ultimoFoco = document.activeElement;
            document.getElementById("modalTitulo").textContent = titulo;

            const corpoEl = document.getElementById("modalCorpo");
            corpoEl.innerHTML = "";
            corpoEl.appendChild(corpo);

            const acoes = document.getElementById("modalAcoes");
            acoes.innerHTML = "";
            (botoes || []).forEach(b => {
                const el = criar(b.href ? "a" : "button", "btn " + (b.classe || ""), b.texto);
                if (b.href) el.href = b.href;
                else el.type = "button";
                el.addEventListener("click", () => {
                    if (b.onClick) b.onClick();
                    if (!b.manter) fecharModal();
                });
                acoes.appendChild(el);
            });

            document.getElementById("modal").hidden = false;
            const primeiro = acoes.querySelector(".btn") || document.getElementById("modalX");
            primeiro.focus();
        }

        function fecharModal() {
            document.getElementById("modal").hidden = true;
            if (ultimoFoco && ultimoFoco.focus) ultimoFoco.focus();
        }

        document.getElementById("modalX").addEventListener("click", fecharModal);
        document.getElementById("modal").addEventListener("click", e => {
            if (e.target.id === "modal") fecharModal();
        });
        document.addEventListener("keydown", e => {
            if (e.key === "Escape" && !document.getElementById("modal").hidden) fecharModal();
        });

        /* ---------- Gráfico de linha (SVG, com tooltip) ---------- */
        const W = 440, L = 52, R = 428, T = 18, B = 205;
        let periodoAtual = "essa semana";
        let geo = null;

        function desenharGrafico(animar) {
            const dados = PERIODOS[periodoAtual];
            const svg = document.getElementById("grafico");

            const maxVal = Math.max(...dados.map(d => d.qtd), 1);
            const passo = maxVal <= 6 ? 1 : Math.ceil(maxVal / 6);
            const topo = passo === 1 ? Math.max(6, maxVal) : Math.ceil(maxVal / passo) * passo;

            const passoX = (R - L) / dados.length;
            const x = i => L + passoX * i + passoX / 2;
            const y = v => B - (v / topo) * (B - T);
            geo = { dados, x, y, passoX };

            let s = "";
            for (let v = 0; v <= topo; v += passo) {
                s += `<line x1="${L}" y1="${y(v)}" x2="${R}" y2="${y(v)}" stroke="${v === 0 ? '#bdbdbd' : '#ececec'}" stroke-width="1"/>`;
                s += `<text x="${L - 12}" y="${y(v) + 4}" font-size="12" fill="#444" text-anchor="end">${v}</text>`;
            }
            dados.forEach((d, i) => {
                s += `<text x="${x(i)}" y="${B + 22}" font-size="12" fill="#222" text-anchor="middle">${d.dia}</text>`;
            });

            s += `<line id="guia" x1="0" y1="${T}" x2="0" y2="${B}" stroke="#4f7cf5" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>`;

            const pontos = dados.map((d, i) => `${x(i)},${y(d.qtd)}`).join(" ");
            const estiloLinha = animar ? 'pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1;animation:desenhar .8s ease forwards"' : "";
            s += `<polyline ${estiloLinha} points="${pontos}" fill="none" stroke="#4f7cf5" stroke-width="1.8" stroke-linejoin="round"/>`;
            dados.forEach((d, i) => {
                s += `<circle cx="${x(i)}" cy="${y(d.qtd)}" r="2.5" fill="#4f7cf5"/>`;
            });
            s += `<circle id="pontoAtivo" r="6" fill="#4f7cf5" stroke="#fff" stroke-width="2" visibility="hidden"/>`;

            s += `<text transform="translate(14 ${(T + B) / 2}) rotate(-90)" font-size="12" fill="#222" text-anchor="middle">Alertas</text>`;
            s += `<text x="${(L + R) / 2}" y="${B + 44}" font-size="12" fill="#222" text-anchor="middle">${ROTULO_X[periodoAtual]}</text>`;

            svg.innerHTML = s;
        }

        function configurarTooltip() {
            const svg = document.getElementById("grafico");
            const tip = document.getElementById("tooltip");
            const card = svg.closest(".chart-card");

            function esconder() {
                tip.classList.remove("visivel");
                const g = svg.querySelector("#guia"), p = svg.querySelector("#pontoAtivo");
                if (g) g.setAttribute("visibility", "hidden");
                if (p) p.setAttribute("visibility", "hidden");
            }

            function mostrar(clientX) {
                if (!geo) return;
                const rect = svg.getBoundingClientRect();
                const vx = (clientX - rect.left) / rect.width * W;
                if (vx < L || vx > R) return esconder();

                const i = Math.min(geo.dados.length - 1, Math.max(0, Math.floor((vx - L) / geo.passoX)));
                const d = geo.dados[i];
                const px = geo.x(i), py = geo.y(d.qtd);

                const g = svg.querySelector("#guia"), p = svg.querySelector("#pontoAtivo");
                g.setAttribute("x1", px); g.setAttribute("x2", px); g.setAttribute("visibility", "visible");
                p.setAttribute("cx", px); p.setAttribute("cy", py); p.setAttribute("visibility", "visible");

                const cardRect = card.getBoundingClientRect();
                tip.innerHTML = "";
                tip.appendChild(criar("strong", "", d.dia));
                tip.appendChild(document.createElement("br"));
                tip.appendChild(document.createTextNode(d.qtd + (d.qtd === 1 ? " alerta" : " alertas")));
                tip.style.left = (rect.left - cardRect.left + px / W * rect.width) + "px";
                tip.style.top = (rect.top - cardRect.top + py / 270 * rect.height - 12) + "px";
                tip.classList.add("visivel");
            }

            svg.addEventListener("mousemove", e => mostrar(e.clientX));
            svg.addEventListener("mouseleave", esconder);
            svg.addEventListener("touchstart", e => mostrar(e.touches[0].clientX), { passive: true });
            svg.addEventListener("touchmove", e => mostrar(e.touches[0].clientX), { passive: true });
        }

        document.getElementById("periodo").addEventListener("change", e => {
            periodoAtual = e.target.value;
            desenharGrafico(lerPref("animar", true));
            toast("Período: " + periodoAtual);
        });

        /* ---------- Alertas recentes ---------- */
        function desenharAlertas() {
            const ul = document.getElementById("listaAlertas");
            ul.innerHTML = "";
            if (!alertasRecentes.length) { ul.appendChild(criar("li", "alert-item", "Nenhum alerta registrado.")); return; }
            const primeiroNaoLido = alertasRecentes.findIndex(a => !a.lido);

            alertasRecentes.forEach((a, i) => {
                const li = criar("li", "alert-item" + (i === primeiroNaoLido ? " destaque" : "") + (a.lido ? " lido" : ""));
                li.tabIndex = 0;
                li.setAttribute("role", "button");
                li.title = "Ver detalhes do alerta";
                li.appendChild(criar("span", "dot"));
                li.appendChild(criar("span", "nome", a.nome));
                li.appendChild(criar("span", "data", a.data));
                const abrir = () => abrirAlerta(a);
                li.addEventListener("click", abrir);
                li.addEventListener("keydown", e => {
                    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); abrir(); }
                });
                ul.appendChild(li);
            });
        }

        function abrirAlerta(a) {
            const corpo = document.createElement("div");

            const l1 = criar("div", "modal-linha");
            l1.appendChild(criar("span", "", "Nível"));
            const nivelClasse = a.nivel === "Alto" ? "alto" : a.nivel === "Médio" ? "medio" : "baixo";
            l1.appendChild(criar("span", "badge " + nivelClasse, a.nivel));
            corpo.appendChild(l1);

            const l2 = criar("div", "modal-linha");
            l2.appendChild(criar("span", "", "Data"));
            l2.appendChild(criar("strong", "", a.data));
            corpo.appendChild(l2);

            const l3 = criar("div", "modal-linha");
            l3.appendChild(criar("span", "", "Status"));
            l3.appendChild(criar("strong", "", a.lido ? "Resolvido" : "Em aberto"));
            corpo.appendChild(l3);

            const desc = criar("p", "", a.descricao);
            desc.style.marginTop = "12px";
            corpo.appendChild(desc);

            abrirModal(a.nome, corpo, [
                { texto: "Ver colaboradores", href: "colaboradores.html" },
                { texto: "Abrir em Alertas", classe: "primario", href: "alertas.html" }
            ]);
        }


        /* ---------- Colaborador com mais alertas ---------- */
        function abrirTopColaborador() {
            const corpo = document.createElement("div");
            if (!COLAB_TOP.length) corpo.appendChild(criar("p", "", "Nenhum alerta registrado ainda."));
            COLAB_TOP.forEach((c, i) => {
                const l = criar("div", "modal-linha");
                l.appendChild(criar("span", "", (i + 1) + "º " + c.nome));
                l.appendChild(criar("strong", "", c.qtd + (c.qtd === 1 ? " alerta" : " alertas")));
                corpo.appendChild(l);
            });
            abrirModal("Colaboradores com mais alertas", corpo, [
                { texto: "Fechar" },
                { texto: "Ver alertas", classe: "amarelo", href: "alertas.html" }
            ]);
        }

        const topCard = document.getElementById("topCard");
        topCard.addEventListener("click", abrirTopColaborador);
        topCard.addEventListener("keydown", e => {
            if (e.key === "Enter" || e.key === " ") { e.preventDefault(); abrirTopColaborador(); }
        });

        /* ---------- Cards de resumo clicáveis ---------- */
        document.querySelectorAll(".kpi[data-href]").forEach(k => {
            const ir = () => { window.location.href = k.dataset.href; };
            k.addEventListener("click", ir);
            k.addEventListener("keydown", e => { if (e.key === "Enter") ir(); });
        });

        function aplicarPrefs() {
            document.querySelector(".kpis").style.display = lerPref("resumo", true) ? "flex" : "none";
        }

        /* ---------- Menu: Configurações, Ajuda e Sair ---------- */
        document.getElementById("btnAjuda").addEventListener("click", e => {
            e.preventDefault();
            const corpo = document.createElement("div");
            const ul = document.createElement("ul");
            [
                "Passe o mouse no gráfico para ver o número de alertas de cada dia.",
                "Use o seletor \"Período\" para alternar entre semana, semana passada e mês.",
                "Clique em um alerta recente para ver os detalhes e marcá-lo como lido.",
                "Clique nos cards de resumo para ir direto à página correspondente.",
                "Pressione Esc para fechar qualquer janela."
            ].forEach(t => ul.appendChild(criar("li", "", t)));
            corpo.appendChild(ul);
            abrirModal("Ajuda", corpo, [{ texto: "Entendi", classe: "amarelo" }]);
        });

        function pedirLogout() {
            const corpo = criar("p", "", "Tem certeza de que deseja sair do painel?");
            abrirModal("Sair", corpo, [
                { texto: "Cancelar" },
                { texto: "Sair", classe: "primario", onClick: logout, manter: true }
            ]);
        }

        function logout() {
            sessionStorage.removeItem("token"); try { localStorage.removeItem("mj_token"); } catch (e) {}
            window.location.href = "index.html";
        }

        /* ---------- Integração com a API (mesma lógica de antes) ---------- */
        async function carregarDashboard() {
            const token = sessionStorage.getItem("token");

            if (!token) {
                if (DEMO) return; // modo demonstração: abra dashboard.html?demo para testar sem login
                window.location.href = "index.html";
                return;
            }

            carregarAlertasPainel(token);
            try {
                const resposta = await fetch(MJ_API + '/api/dashboard/resumo', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (resposta.status === 401) {
                    sessionStorage.removeItem("token"); try { localStorage.removeItem("mj_token"); } catch (e) {}
                    window.location.href = "index.html";
                    return;
                }

                if (resposta.ok) {
                    const dados = await resposta.json();

                    setTexto("totalColaboradores", dados.totalColaboradores);
                    setTexto("colaboradoresAtivos", dados.colaboradoresAtivos);
                    setTexto("colaboradoresPrimeiros90Dias", dados.colaboradoresPrimeiros90Dias);
                    setTexto("alertasPendentes", dados.alertasPendentes);
                    setTexto("alertasNivelAlto", dados.alertasNivelAlto);
                }
            } catch (erro) {
                console.error("Erro na requisição:", erro);
            }
        }

        /* ---------- Início ---------- */
        // o botão "Sair" do menu agora pede confirmação
        document.querySelector('.menu button[onclick="logout()"]').setAttribute("onclick", "pedirLogout()");

        aplicarPrefs();
        configurarTooltip();
        montarDados([]);
        preencherUsuario();
        atualizarPainelAlertas();
        carregarDashboard();
    </script>
</body>
</html>
