<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colaboradores - MéquiJunto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #eeeeee;
            color: #000;
            min-height: 100vh;
            display: flex;
        }

        a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible,
        [tabindex]:focus-visible {
            outline: 3px solid #1a73e8;
            outline-offset: 2px;
        }

        /* ---------- Sidebar ---------- */
        .sidebar {
            width: 200px;
            flex-shrink: 0;
            background-color: #da291c;
            padding: 36px 20px 24px 10px;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .sidebar-logo {
            display: flex;
            justify-content: center;
            margin: 0 0 56px 10px;
        }

        .sidebar-logo img { width: 90px; height: auto; }

        .menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .menu a,
        .menu button {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 9px 14px 9px 36px;
            border: none;
            background: transparent;
            border-radius: 8px;
            color: #fff;
            font-family: 'DM Sans', 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            text-align: left;
            transition: background 0.15s;
        }

        .menu a:hover,
        .menu button:hover { background: rgba(255, 255, 255, 0.15); }

        .menu a.active { background: #ffc400; color: #000; }

        .menu svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            flex-shrink: 0;
            margin-left: -26px;
        }

        /* ---------- Conteúdo ---------- */
        .main {
            flex: 1;
            min-width: 0;
            padding: 34px 40px 28px 24px;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            flex-wrap: wrap;
            margin: 0 38px 26px 24px;
            padding-top: 14px;
        }

        .filtros {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .busca {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fffdf0;
            border: 1px solid #f5c26b;
            border-radius: 24px;
            padding: 0 14px;
            height: 42px;
            width: 250px;
        }

        .busca svg { width: 18px; height: 18px; fill: #8a8a8a; flex-shrink: 0; }

        .busca input {
            border: none;
            background: transparent;
            outline: none;
            font-size: 14px;
            width: 100%;
        }

        .select-status {
            height: 42px;
            border-radius: 24px;
            border: 1px solid #f5c26b;
            background: #fffdf0;
            padding: 0 14px;
            font-size: 14px;
            cursor: pointer;
        }

        .contagem { font-size: 13px; color: #777; }

        .btn-adicionar {
            display: flex;
            align-items: center;
            gap: 14px;
            height: 42px;
            padding: 0 40px 0 14px;
            background: #fffdf0;
            border: 1px solid #f5c26b;
            border-radius: 24px;
            font-family: 'DM Sans', 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform .15s, box-shadow .15s, background .15s;
        }

        .btn-adicionar:hover {
            background: #fff6c9;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(245,194,107,.5);
        }

        .btn-adicionar svg { width: 30px; height: 30px; fill: #ffc400; }

        /* Lista com barra de rolagem amarela */
        .lista {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            margin-left: 24px;
            padding: 4px 20px 24px 0;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scrollbar-color: #ffc400 #f6f1e0;
            scrollbar-width: thin;
        }

        .lista::-webkit-scrollbar { width: 8px; }
        .lista::-webkit-scrollbar-track { background: #f6f1e0; border-radius: 8px; }
        .lista::-webkit-scrollbar-thumb { background: #ffc400; border-radius: 8px; }

        .colab {
            position: relative;
            display: flex;
            align-items: center;
            gap: 20px;
            background: #fffdf0;
            border: 1px solid #f5c26b;
            border-radius: 18px;
            padding: 16px 22px 16px 14px;
            min-height: 90px;
            flex-shrink: 0;
            transition: transform .15s, box-shadow .15s;
            animation: entrar .25s ease;
        }

        @keyframes entrar { from { opacity: 0; transform: translateY(8px); } }

        .colab:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 14px rgba(0,0,0,.12);
        }

        .colab.inativo { border-color: #8a8a8a; background: #fdfbf0; }

        .avatar {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #8e8e8e;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .avatar svg { width: 50px; height: 50px; fill: #fff; }

        .info { flex: 1; min-width: 0; cursor: pointer; }

        .info h3 {
            font-family: 'DM Sans', 'Inter', sans-serif;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .info p { font-size: 12.5px; }

        .status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            width: 148px;
            height: 34px;
            padding: 0 12px 0 28px;
            border: 1px solid #ffc400;
            background: #ffc400;
            border-radius: 6px;
            font-family: 'DM Sans', 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-right: 30px;
            transition: filter .15s, transform .1s;
        }

        .status:hover { filter: brightness(.95); }
        .status:active { transform: scale(.97); }

        .colab.inativo .status { border-color: #222; }

        .switch {
            position: relative;
            width: 38px;
            height: 20px;
            border-radius: 20px;
            background: #ffe27a;
            flex-shrink: 0;
            transition: background .2s;
        }

        .switch::after {
            content: "";
            position: absolute;
            top: 0;
            left: 18px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #222;
            transition: left .2s;
        }

        .colab.inativo .switch { background: #8f8f8f; }
        .colab.inativo .switch::after { left: 0; }

        .dots, .fechar-x {
            position: absolute;
            top: 6px;
            right: 12px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 8px;
        }

        .dots {
            display: flex;
            gap: 3px;
            padding: 6px;
        }

        .dots span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #ffbd2e;
        }

        .dots:hover { background: rgba(255,189,46,.2); }

        .fechar-x {
            color: #da291c;
            font-size: 20px;
            font-weight: 700;
            padding: 0 8px;
            line-height: 1.2;
            right: 14px;
        }

        .fechar-x:hover { background: rgba(218,41,28,.12); }

        .menu-pop {
            position: absolute;
            top: 34px;
            right: 12px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 6px 18px rgba(0,0,0,.2);
            padding: 6px;
            z-index: 10;
            min-width: 160px;
            animation: entrar .12s ease;
        }

        .menu-pop button {
            display: block;
            width: 100%;
            text-align: left;
            border: none;
            background: transparent;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        .menu-pop button:hover { background: #fff3c4; }
        .menu-pop button.perigo { color: #da291c; }

        .vazio {
            text-align: center;
            color: #777;
            padding: 40px 0;
            font-size: 15px;
        }

        /* ---------- Modal ---------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.5);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 50;
        }

        .modal-overlay[hidden] { display: none; }

        .modal {
            position: relative;
            background: #fffdf0;
            border: 1px solid #7b7b7b;
            border-radius: 18px;
            width: 100%;
            max-width: 460px;
            max-height: 92vh;
            overflow-y: auto;
            padding: 28px 26px 22px;
            box-shadow: 0 12px 40px rgba(0,0,0,.3);
            animation: surgir .18s ease;
        }

        @keyframes surgir { from { opacity: 0; transform: translateY(10px) scale(.98); } }

        .modal h2 {
            font-family: 'DM Sans', 'Inter', sans-serif;
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 14px;
            padding-right: 28px;
        }

        .modal-x {
            position: absolute;
            top: 12px;
            right: 14px;
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: transparent;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
        }

        .modal-x:hover { background: rgba(0,0,0,.08); }

        .modal-corpo { font-size: 14px; line-height: 1.5; }
        .modal-corpo p { margin-bottom: 10px; }
        .modal-corpo ul { margin: 0 0 10px 18px; }
        .modal-corpo li { margin-bottom: 4px; }

        .modal-linha {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 7px 0;
            border-bottom: 1px solid #ece6c4;
        }

        .modal-linha:last-of-type { border-bottom: none; }

        .modal-acoes {
            display: flex;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        .btn {
            padding: 9px 16px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #fff;
            color: #000;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: filter .15s, transform .1s;
        }

        .btn:hover { filter: brightness(.94); }
        .btn:active { transform: scale(.97); }
        .btn:disabled { opacity: .6; cursor: wait; }
        .btn.primario { background: #da291c; border-color: #da291c; color: #fff; }
        .btn.amarelo { background: #ffc400; border-color: #ffc400; }

        /* Formulário */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 14px;
        }

        .campo.cheio { grid-column: span 2; }

        .campo label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .campo input, .campo select {
            width: 100%;
            height: 40px;
            border: 1px solid #cfc6a0;
            border-radius: 8px;
            background: #fff;
            padding: 0 10px;
            font-size: 14px;
        }

        .campo input:focus, .campo select:focus {
            outline: none;
            border-color: #ffc400;
            box-shadow: 0 0 0 3px rgba(255,196,0,.35);
        }

        .erro-form {
            grid-column: span 2;
            color: #da291c;
            font-size: 13px;
            font-weight: 600;
            min-height: 0;
        }

        .opcao {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #ece6c4;
            cursor: pointer;
        }

        .opcao input { width: 18px; height: 18px; accent-color: #da291c; cursor: pointer; }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translate(-50%, 20px);
            background: #222;
            color: #fff;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s, transform .2s;
            z-index: 60;
        }

        .toast.visivel { opacity: 1; transform: translate(-50%, 0); }

        /* ---------- Responsivo ---------- */
        @media (max-width: 800px) {
            .colab { flex-wrap: wrap; }
            .status { margin-right: 0; }
            .toolbar { margin-left: 0; margin-right: 0; }
            .lista { margin-left: 0; }
        }

        @media (max-width: 700px) {
            body { flex-direction: column; }
            .sidebar {
                width: 100%;
                height: auto;
                position: static;
                padding: 20px 14px;
            }
            .sidebar-logo { margin: 0 0 18px 0; }
            .sidebar-logo img { width: 60px; }
            .menu { flex-direction: row; flex-wrap: wrap; }
            .menu li { flex: 1 1 auto; }
            .menu a, .menu button { padding: 8px 12px; justify-content: center; }
            .menu svg { margin-left: 0; }
            .main { height: auto; padding: 18px 14px; }
            .busca { width: 100%; }
            .form-grid { grid-template-columns: 1fr; }
            .campo.cheio, .erro-form { grid-column: span 1; }
        }
    </style>

    <div class="modal-overlay" id="modal" hidden>

            <div class="modal-acoes" id="modalAcoes"></div>

    <div class="toast" id="toast" role="status"></div>

    <script>
        const DEMO = new URLSearchParams(location.search).has("demo");
        const API_URL = MJ_API + "/api/usuarios";
        const token = sessionStorage.getItem("token");

        const ICONE_PESSOA = '<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';

        let colaboradores = [];
        let carregando = true;
        let erroCarga = null;

        /* ---------- Utilidades ---------- */
        function criar(tag, classe, texto) {
            const el = document.createElement(tag);
            if (classe) el.className = classe;
            if (texto !== undefined) el.textContent = texto;
            return el;
        }

        function normalizar(t) {
            return String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
        }

        function formatarData(s) {
            if (!s) return "-";
            const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
            return m ? `${m[3]}/${m[2]}/${m[1]}` : s;
        }

        function formatarDataHora(valor) {
            if (!valor) return "Ainda não houve interação";
            const data = new Date(valor);
            if (Number.isNaN(data.getTime())) return String(valor);
            return data.toLocaleString("pt-BR", {
                dateStyle: "short",
                timeStyle: "short"
            });
        }

        function lerPref(chave, padrao) {
            try {
                const v = localStorage.getItem("mj_" + chave);
                return v === null ? padrao : v === "1";
            } catch (e) { return padrao; }
        }

        function salvarPref(chave, valor) {
            try { localStorage.setItem("mj_" + chave, valor ? "1" : "0"); } catch (e) {}
        }

        let toastTimer;
        function toast(msg) {
            const t = document.getElementById("toast");
            t.textContent = msg;
            t.classList.add("visivel");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove("visivel"), 2400);
        }

        /* ---------- Modal ---------- */
        let ultimoFoco = null;

        function abrirModal(titulo, corpo, botoes) {
            ultimoFoco = document.activeElement;
            document.getElementById("modalTitulo").textContent = titulo;

            const corpoEl = document.getElementById("modalCorpo");
            corpoEl.innerHTML = "";
            corpoEl.appendChild(corpo);

            const acoes = document.getElementById("modalAcoes");
            acoes.innerHTML = "";
            (botoes || []).forEach(b => {
                const el = criar(b.href ? "a" : "button", "btn " + (b.classe || ""), b.texto);
                if (b.href) el.href = b.href; else el.type = "button";
                el.addEventListener("click", () => {
                    if (b.onClick) b.onClick();
                    if (!b.manter) fecharModal();
                });
                acoes.appendChild(el);
            });

            document.getElementById("modal").hidden = false;
            const foco = corpoEl.querySelector("input, select") || acoes.querySelector(".btn") || document.getElementById("modalX");
            foco.focus();
        }

        function fecharModal() {
            document.getElementById("modal").hidden = true;
            if (ultimoFoco && ultimoFoco.focus) ultimoFoco.focus();
        }

        document.getElementById("modalX").addEventListener("click", fecharModal);
        document.getElementById("modal").addEventListener("click", e => {
            if (e.target.id === "modal") fecharModal();
        });
        document.addEventListener("keydown", e => {
            if (e.key === "Escape") {
                if (!document.getElementById("modal").hidden) fecharModal();
                fecharMenuPop();
            }
        });

        /* ---------- Lista ---------- */
        function filtrados() {
            const termo = normalizar(document.getElementById("busca").value.trim());
            const status = document.getElementById("filtroStatus").value;
            const mostrarInativos = lerPref("inativos", true);

            return colaboradores.filter(c => {
                if (!mostrarInativos && !c.ativo) return false;
                if (status === "ativos" && !c.ativo) return false;
                if (status === "inativos" && c.ativo) return false;
                if (termo && !normalizar(c.nome).includes(termo) && !normalizar(c.cargo).includes(termo)) return false;
                return true;
            });
        }

        function desenharLista() {
            const lista = document.getElementById("lista");
            lista.innerHTML = "";
            fecharMenuPop();

            if (carregando) {
                lista.appendChild(criar("p", "vazio", "Carregando..."));
                document.getElementById("contagem").textContent = "";
                return;
            }

            if (erroCarga) {
                document.getElementById("contagem").textContent = "";
                const box = criar("div", "vazio");
                box.appendChild(criar("p", "", erroCarga));
                const dica = criar("p", "", "Para ver a tela com dados de exemplo, abra colaboradores.html?demo");
                dica.style.cssText = "font-size:13px;margin-top:8px";
                box.appendChild(dica);
                const b = criar("button", "btn amarelo", "Tentar novamente");
                b.type = "button";
                b.style.marginTop = "14px";
                b.addEventListener("click", () => {
                    carregando = true; erroCarga = null; desenharLista(); carregarColaboradores();
                });
                box.appendChild(b);
                lista.appendChild(box);
                return;
            }

            const itens = filtrados();
            document.getElementById("contagem").textContent =
                itens.length + (itens.length === 1 ? " colaborador" : " colaboradores");

            if (itens.length === 0) {
                lista.appendChild(criar("p", "vazio",
                    colaboradores.length === 0 ? "Nenhum colaborador cadastrado." : "Nenhum colaborador encontrado."));
                return;
            }

            itens.forEach(c => lista.appendChild(criarCartao(c)));
        }

        function criarCartao(c) {
            const card = criar("article", "colab" + (c.ativo ? "" : " inativo"));

            const avatar = criar("div", "avatar");
            avatar.innerHTML = ICONE_PESSOA;
            card.appendChild(avatar);

            const info = criar("div", "info");
            info.tabIndex = 0;
            info.setAttribute("role", "button");
            info.title = "Ver detalhes";
            info.appendChild(criar("h3", "", c.nome));
            info.appendChild(criar("p", "", "Data de entrada: " + formatarData(c.dataIngresso)
                + " · Escala: " + (c.escala || "-")
                + " · Telefone: " + (c.telefone || "-")));
            info.addEventListener("click", () => abrirDetalhes(c));
            info.addEventListener("keydown", e => {
                if (e.key === "Enter" || e.key === " ") { e.preventDefault(); abrirDetalhes(c); }
            });
            card.appendChild(info);

            const status = criar("button", "status");
            status.type = "button";
            status.setAttribute("role", "switch");
            status.setAttribute("aria-checked", c.ativo ? "true" : "false");
            status.title = c.ativo ? "Clique para desativar" : "Clique para reativar";
            status.appendChild(criar("span", "", c.ativo ? "Ativo" : "Inativo"));
            status.appendChild(criar("span", "switch"));
            status.addEventListener("click", () => alternarStatus(c));
            card.appendChild(status);

            if (c.ativo) {
                const dots = criar("button", "dots");
                dots.type = "button";
                dots.setAttribute("aria-label", "Mais opções");
                dots.innerHTML = "<span></span><span></span><span></span>";
                dots.addEventListener("click", e => {
                    e.stopPropagation();
                    abrirMenuPop(card, c);
                });
                card.appendChild(dots);
            } else {
                const x = criar("button", "fechar-x", "X");
                x.type = "button";
                x.setAttribute("aria-label", "Ver detalhes");
                x.title = "Ver detalhes";
                x.addEventListener("click", () => abrirDetalhes(c));
                card.appendChild(x);
            }

            return card;
        }

        /* ---------- Menu "..." ---------- */
        function fecharMenuPop() {
            document.querySelectorAll(".menu-pop").forEach(m => m.remove());
        }

        function abrirMenuPop(card, c) {
            const jaAberto = card.querySelector(".menu-pop");
            fecharMenuPop();
            if (jaAberto) return;

            const menu = criar("div", "menu-pop");
            const ver = criar("button", "", "Ver detalhes");
            ver.addEventListener("click", () => { fecharMenuPop(); abrirDetalhes(c); });
            const des = criar("button", "perigo", "Desativar");
            des.addEventListener("click", () => { fecharMenuPop(); alternarStatus(c); });
            menu.appendChild(ver);
            menu.appendChild(des);
            card.appendChild(menu);
        }

        document.addEventListener("click", e => {
            if (!e.target.closest(".menu-pop")) fecharMenuPop();
        });

        /* ---------- Detalhes ---------- */
        function abrirDetalhes(c) {
            const corpo = document.createElement("div");
            [
                ["ID", c.id],
                ["Telefone", c.telefone || "-"],
                ["Cargo", c.cargo || "-"],
                ["Idade", c.idade ?? "-"],
                ["Gênero", c.genero || "-"],
                ["Data de entrada", formatarData(c.dataIngresso)],
                ["Escala", c.escala || "-"],
                ["Última interação", formatarDataHora(c.ultimaInteracao || c.ultima_interacao)],
                ["Estado", c.ativo ? "Ativo" : "Inativo"]
            ].forEach(([rotulo, valor]) => {
                const l = criar("div", "modal-linha");
                l.appendChild(criar("span", "", rotulo));
                l.appendChild(criar("strong", "", String(valor)));
                corpo.appendChild(l);
            });

            const botoes = [{ texto: "Fechar" }, { texto: "Editar", onClick: () => setTimeout(() => abrirFormulario(c), 0) }];
            if (c.ativo) botoes.push({ texto: "Desativar", classe: "primario", onClick: () => alternarStatus(c), manter: true });
            else botoes.push({ texto: "Reativar", classe: "amarelo", onClick: () => reativar(c) });
            abrirModal(c.nome, corpo, botoes);
        }

        /* ---------- Ativar / desativar ---------- */
        function alternarStatus(c) {
            if (c.ativo) pedirDesativar(c);
            else reativar(c);
        }

        function pedirDesativar(c) {
            abrirModal("Desativar colaborador",
                criar("p", "", "Tem certeza de que deseja desativar " + c.nome + "?"),
                [
                    { texto: "Cancelar" },
                    { texto: "Desativar", classe: "primario", onClick: () => desativarColaborador(c) }
                ]);
        }

        async function desativarColaborador(c) {
            if (DEMO) {
                c.ativo = false;
                desenharLista();
                return toast("Colaborador desativado");
            }
            try {
                const res = await fetch(`${API_URL}/${c.id}/desativar`, {
                    method: 'PATCH',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    toast("Colaborador desativado");
                    carregarColaboradores();
                } else {
                    toast("Erro ao desativar colaborador.");
                }
            } catch (err) {
                console.error("Erro:", err);
                toast("Erro ao conectar com o servidor.");
            }
        }

        async function reativar(c) {
            if (DEMO) {
                c.ativo = true;
                desenharLista();
                return toast("Colaborador reativado");
            }
            // O back não tem rota /ativar: reativa pelo PUT /api/usuarios/{id} com ativo = true
            try {
                const res = await fetch(`${API_URL}/${c.id}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome: c.nome, telefone: c.telefone, cargo: c.cargo, escala: c.escala || null, idade: c.idade, genero: c.genero, dataIngresso: c.dataIngresso, ativo: true })
                });
                if (res.ok) {
                    toast("Colaborador reativado");
                    carregarColaboradores();
                } else {
                    toast("Não foi possível reativar o colaborador.");
                }
            } catch (err) {
                console.error("Erro:", err);
                toast("Erro ao conectar com o servidor.");
            }
        }

        /* ---------- Cadastro ---------- */
        function abrirFormulario(edit) {
            if (edit instanceof Event) edit = null; // nunca tratar o clique como colaborador
            const form = criar("form", "form-grid");
            form.noValidate = false;

            const campos = [
                { id: "nome", rotulo: "Nome completo*", tipo: "text", req: true, ph: "Ex: João da Silva", cheio: true },
                { id: "telefone", rotulo: "Telefone*", tipo: "text", req: true, ph: "Ex: 51999999999" },
                { id: "cargo", rotulo: "Cargo*", tipo: "text", req: true, ph: "Ex: Atendente" },
                { id: "escala", rotulo: "Escala*", tipo: "escala", req: true, opcoes: ["5x2", "4x3", "12x36"] },
                { id: "idade", rotulo: "Idade", tipo: "number", ph: "Ex: 25" },
                { id: "genero", rotulo: "Gênero", tipo: "select", opcoes: ["Masculino", "Feminino", "Outro", "Não informar"] },
                { id: "dataIngresso", rotulo: "Data de ingresso*", tipo: "date", req: true, cheio: true }
            ];

            campos.forEach(f => {
                const box = criar("div", "campo" + (f.cheio ? " cheio" : ""));
                const label = criar("label", "", f.rotulo);
                label.htmlFor = "f_" + f.id;
                box.appendChild(label);

                let input;
                if (f.tipo === "select" || f.tipo === "escala") {
                    input = document.createElement("select");
                    if (f.tipo === "escala") {
                        const placeholder = criar("option", "", "Selecione a escala");
                        placeholder.value = "";
                        placeholder.disabled = true;
                        placeholder.selected = true;
                        input.appendChild(placeholder);
                    }
                    f.opcoes.forEach(o => {
                        const op = criar("option", "", o);
                        op.value = o;
                        input.appendChild(op);
                    });
                    if (f.tipo === "escala") input.value = "";
                } else {
                    input = document.createElement("input");
                    input.type = f.tipo;
                    if (f.ph) input.placeholder = f.ph;
                    if (f.tipo === "number") { input.min = "14"; input.max = "100"; }
                }
                input.id = "f_" + f.id;
                if (f.req) input.required = true;
                box.appendChild(input);
                form.appendChild(box);
            });

            const erro = criar("div", "erro-form");
            form.appendChild(erro);

            if (edit) {
                const set = (id, v) => { if (v !== null && v !== undefined) form.querySelector("#f_" + id).value = v; };
                set("nome", edit.nome); set("telefone", edit.telefone); set("cargo", edit.cargo);
                set("escala", edit.escala); set("idade", edit.idade); set("genero", edit.genero); set("dataIngresso", edit.dataIngresso);
            }

            const acoes = criar("div", "modal-acoes");
            acoes.style.gridColumn = "span 2";
            const cancelar = criar("button", "btn", "Cancelar");
            cancelar.type = "button";
            cancelar.addEventListener("click", fecharModal);
            const salvar = criar("button", "btn amarelo", "Guardar Colaborador");
            salvar.type = "submit";
            acoes.appendChild(cancelar);
            acoes.appendChild(salvar);
            form.appendChild(acoes);

            form.addEventListener("submit", async e => {
                e.preventDefault();
                erro.textContent = "";

                const val = id => form.querySelector("#f_" + id).value;
                const bodyData = {
                    nome: val("nome").trim(),
                    telefone: val("telefone").trim(),
                    cargo: val("cargo").trim(),
                    escala: val("escala").trim(),
                    idade: parseInt(val("idade")) || null,
                    genero: val("genero") === "Não informar" ? null : val("genero"),
                    dataIngresso: val("dataIngresso")
                };

                salvar.disabled = true;
                salvar.textContent = "Salvando...";

                try {
                    if (DEMO) {
                        colaboradores.unshift({
                            id: Date.now(), nome: bodyData.nome, telefone: bodyData.telefone,
                            cargo: bodyData.cargo, escala: bodyData.escala, dataIngresso: bodyData.dataIngresso, ativo: true
                        });
                        fecharModal();
                        desenharLista();
                        toast("Colaborador cadastrado com sucesso!");
                        return;
                    }

                    const res = await fetch(edit ? `${API_URL}/${edit.id}` : API_URL, {
                        method: edit ? 'PUT' : 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(edit ? { ...bodyData, ativo: edit.ativo } : bodyData)
                    });

                    if (res.ok) {
                        fecharModal();
                        toast(edit ? "Colaborador atualizado!" : "Colaborador cadastrado com sucesso!");
                        carregarColaboradores();
                    } else {
                        let msg = res.status;
                        try { const err = await res.json(); msg = err.message || msg; } catch (x) {}
                        erro.textContent = res.status === 409 ? "Esse telefone já está cadastrado para outro colaborador."
                            : res.status === 400 ? "Dados inválidos. Confira nome, telefone, cargo e data de ingresso."
                            : "Erro ao salvar (" + msg + ").";
                    }
                } catch (err) {
                    console.error("Erro ao salvar:", err);
                    erro.textContent = "Erro ao conectar com o servidor.";
                } finally {
                    salvar.disabled = false;
                    salvar.textContent = "Guardar Colaborador";
                }
            });

            abrirModal(edit ? "Editar Colaborador" : "Adicionar Colaborador", form, []);
        }

        /* ---------- API: listar ---------- */
        async function carregarColaboradores() {
            try {
                const res = await fetch(API_URL, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.status === 401) {
                    sessionStorage.removeItem("token"); try { localStorage.removeItem("mj_token"); } catch (e) {}
                    window.location.href = "index.html";
                    return;
                }

                if (res.ok) {
                    const dados = await res.json();
                    // aceita lista direta ou paginada ({ content: [...] }, { data: [...] }, etc.)
                    console.log("Resposta de /api/usuarios:", dados);
                    // lista direta, ou a primeira lista encontrada dentro do objeto (ex.: { content: [...] })
                    const lista = Array.isArray(dados) ? dados
                        : (dados && typeof dados === "object" ? Object.values(dados).find(Array.isArray) : null);
                    if (Array.isArray(lista)) colaboradores = lista;
                    else erroCarga = "A resposta da API veio em um formato inesperado" +
                        (dados && typeof dados === "object" ? " (campos: " + Object.keys(dados).join(", ") + ")." : ".");
                } else {
                    erroCarga = res.status === 403
                        ? "Sem permissão para listar colaboradores (erro 403)."
                        : "A API respondeu com erro " + res.status + " ao buscar os colaboradores.";
                }
            } catch (err) {
                console.error("Erro:", err);
                erroCarga = "Não consegui conectar em " + API_URL + ". O backend está rodando?";
            }
            carregando = false;
            desenharLista();
        }

        /* ---------- Menu lateral ---------- */
        document.getElementById("btnAjuda").addEventListener("click", e => {
            e.preventDefault();
            const corpo = document.createElement("div");
            const ul = document.createElement("ul");
            [
                "Use a busca para filtrar por nome ou cargo e o seletor para ver só ativos ou inativos.",
                "Clique no nome de um colaborador para ver os detalhes.",
                "Clique no botão Ativo/Inativo para desativar ou reativar um colaborador.",
                "Nos detalhes do colaborador você pode editar os dados cadastrais.",
                "Pressione Esc para fechar qualquer janela."
            ].forEach(t => ul.appendChild(criar("li", "", t)));
            corpo.appendChild(ul);
            abrirModal("Ajuda", corpo, [{ texto: "Entendi", classe: "amarelo" }]);
        });

        function logout() {
            sessionStorage.removeItem("token"); try { localStorage.removeItem("mj_token"); } catch (e) {}
            window.location.href = "index.html";
        }

        document.getElementById("btnSair").addEventListener("click", () => {
            abrirModal("Sair", criar("p", "", "Tem certeza de que deseja sair do painel?"), [
                { texto: "Cancelar" },
                { texto: "Sair", classe: "primario", onClick: logout, manter: true }
            ]);
        });

        /* ---------- Início ---------- */
        document.getElementById("btnAdicionar").addEventListener("click", () => abrirFormulario());
        document.getElementById("busca").addEventListener("input", desenharLista);
        document.getElementById("filtroStatus").addEventListener("change", desenharLista);

        if (!token && !DEMO) {
            window.location.href = "index.html";
        } else if (DEMO) {
            // Modo demonstração: abra colaboradores.html?demo para testar sem backend
            colaboradores = [
                { id: 1, nome: "Ana Júlia de Santos", telefone: "51999990001", cargo: "Atendente", escala: "5x2", dataIngresso: "2026-10-03", ativo: true },
                { id: 2, nome: "Rayssa Ribeiro Grillo", telefone: "51999990002", cargo: "Cozinheira", escala: "5x2", dataIngresso: "2026-09-20", ativo: false },
                { id: 3, nome: "Pedro Moreira da Silva", telefone: "51999990003", cargo: "Atendente", escala: "5x2", dataIngresso: "2026-09-03", ativo: true },
                { id: 4, nome: "Humberto Barreto", telefone: "51999990004", cargo: "Caixa", escala: "5x2", dataIngresso: "2026-08-15", ativo: true },
                { id: 5, nome: "Nicolas Kreling", telefone: "51999990005", cargo: "Chapeiro", escala: "5x2", dataIngresso: "2026-08-02", ativo: true }
            ];
            carregando = false;
            desenharLista();
        } else {
            carregarColaboradores();
        }
    </script>
</body>
</html>
