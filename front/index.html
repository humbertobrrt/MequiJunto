<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MéquiJunto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700;800&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'DM Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
 
        html, body {
            height: 100%;
        }
 
        body {
            background-color: #fdf3ee;
            display: flex;
        }
 
        /* Tela dividida ocupando tudo */
        .login-card {
            display: flex;
            width: 100%;
            min-height: 100vh;
            margin-left: 6px;
        }
 
        /* Lado Esquerdo */
        .brand-section {
            flex: 1;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 40px;
        }
 
        .brand-logo {
            width: 420px;
            max-width: 85%;
            height: auto;
            overflow: visible;
            margin-top: -10px;
        }
 
        .brand-footer {
            position: absolute;
            bottom: 8px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: 'Inter', 'DM Sans', sans-serif;
            font-size: 20px;
            font-weight: 400;
            color: #7d7d7d;
            letter-spacing: 0.3px;
        }
 
        /* Lado Direito */
        .form-section {
            flex: 1;
            background-color: #ffc400;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 40px;
            position: relative;
        }
 
        .form-wrapper {
            width: 100%;
            max-width: 302px;
        }
 
        .form-title {
            font-size: 48px;
            font-weight: 800;
            color: #000;
            margin-bottom: 38px;
            text-align: center;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
 
        .input-group {
            margin-bottom: 18px;
        }
 
        .input-group label {
            display: block;
            font-size: 18px;
            font-weight: 500;
            color: #000;
            margin-bottom: 6px;
        }
 
        .input-group input {
            width: 100%;
            height: 49px;
            border-radius: 5px;
            border: none;
            background: #fff;
            padding: 0 14px;
            font-size: 16px;
            outline: none;
        }
 
        .input-group input:focus {
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.35);
        }
 
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-top: 28px;
            margin-bottom: 36px;
            color: #000;
            white-space: nowrap;
        }
 
        .options-row label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
 
        .options-row input[type="checkbox"] {
            width: 13px;
            height: 13px;
            accent-color: #fff;
        }
 
        .options-row a {
            color: #000;
            text-decoration: underline;
        }
 
        .btn-entrar {
            width: 100%;
            height: 49px;
            background-color: #da291c; /* Vermelho Méqui */
            color: white;
            border: 1px solid #7a7fd6;
            border-radius: 5px;
            font-family: 'Inter', 'DM Sans', sans-serif;
            font-size: 20px;
            font-weight: 400;
            cursor: pointer;
            transition: background 0.2s;
        }
 
        .btn-entrar:disabled { opacity: .7; cursor: wait; }
        .btn-entrar:hover {
            background-color: #b8200f;
        }
 
        .link-cadastro {
            text-align: center;
            margin-top: 34px;
        }
 
        .link-cadastro a {
            color: #000;
            font-weight: 500;
            font-size: 20px;
            text-decoration: underline;
        }
 
        .tag-debug {
            position: absolute;
            bottom: 8px;
            right: 28px;
            font-size: 20px;
            font-weight: 700;
            color: #000;
        }
 
        .erro-msg {
            color: #db0007;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            min-height: 0;
        }
 
        /* Responsivo: empilha em telas pequenas */
        @media (max-width: 800px) {
            .login-card {
                flex-direction: column;
                margin-left: 0;
            }
            .brand-section {
                min-height: 260px;
                padding: 30px 20px 60px;
            }
            .brand-logo {
                width: 260px;
            }
            .brand-footer {
                font-size: 15px;
            }
            .form-section {
                padding: 40px 20px 70px;
            }
            .form-title {
                font-size: 38px;
            }
            .tag-debug {
                font-size: 15px;
            }
        }
    </style>

<body>
 
    <div class="login-card">
        <!-- Lado Esquerdo - Branding -->
        <div class="brand-section">
            <svg class="brand-logo" viewBox="-20 -20 520 400" xmlns="http://www.w3.org/2000/svg" overflow="visible">
                <image href="img/logo-m.png" x="0" y="-4" width="230" height="199"/>
 
                <!-- "équi" ao lado dos arcos -->
                <text x="240" y="175" font-family="'Anton', Impact, 'Arial Narrow', sans-serif"
                      font-size="148" letter-spacing="2" fill="#ffc400">équi</text>
 
                <!-- "junto" embaixo, com respiro dos arcos -->
                <text x="92" y="318" font-family="'Anton', Impact, 'Arial Narrow', sans-serif"
                      font-size="148" letter-spacing="2" fill="#ffc400">junto</text>
            </svg>
            <div class="brand-footer">PLATAFORMA DE GERÊNCIA</div>
        </div>
 
        <!-- Lado Direito - Form -->
        <div class="form-section">
            <div class="form-wrapper">
                <h1 class="form-title">Bem-vindo!</h1>
 
                <div id="msgErro" class="erro-msg"></div>
 
                <form onsubmit="fazerLogin(event)">
                    <div class="input-group">
                        <label for="email">E-mail do usuário</label>
                        <input type="email" id="email" required autocomplete="username" placeholder="voce@mequijunto.com" autofocus>
                    </div>
 
                    <div class="input-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" required autocomplete="current-password" placeholder="••••••••">
                    </div>
 
                    <div class="options-row"><label><input type="checkbox" id="manter"> Me mantenha conectado</label></div>
 
                    <button type="submit" class="btn-entrar" id="btnEntrar">Entrar</button>
                </form>
 
                </div>
 
            </div>
    </div>
 
    <script>
        const lerJwt = t => { try { return JSON.parse(atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))); } catch (e) { return {}; } };

        // "Me mantenha conectado": restaura a sessão se o token salvo ainda não expirou
        (function restaurar() {
            try {
                const t = localStorage.getItem("mj_token");
                if (!t) return;
                if ((lerJwt(t).exp || 0) * 1000 > Date.now()) {
                    sessionStorage.setItem("token", t);
                    location.replace("dashboard.html");
                } else localStorage.removeItem("mj_token");
            } catch (e) {}
        })();

        async function fazerLogin(event) {
            event.preventDefault();
            const msgErro = document.getElementById("msgErro");
            const btn = document.getElementById("btnEntrar");
            msgErro.innerText = "";
            btn.disabled = true;
            btn.textContent = "Entrando...";

            try {
                const resposta = await fetch(MJ_API + '/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById("email").value.trim(), senha: document.getElementById("senha").value })
                });

                if (resposta.ok) {
                    const dados = await resposta.json();
                    sessionStorage.setItem("token", dados.token);
                    try {
                        if (document.getElementById("manter").checked) localStorage.setItem("mj_token", dados.token);
                        else localStorage.removeItem("mj_token");
                    } catch (e) {}
                    window.location.href = "dashboard.html";
                    return;
                }
                msgErro.innerText = (resposta.status === 401 || resposta.status === 403)
                    ? "E-mail ou senha incorretos."
                    : resposta.status === 400 ? "Informe um e-mail válido e a senha."
                    : "O servidor respondeu com erro " + resposta.status + ".";
            } catch (erro) {
                console.error("Erro na requisição:", erro);
                msgErro.innerText = "Não foi possível conectar ao servidor. O back está rodando?";
            }
            btn.disabled = false;
            btn.textContent = "Entrar";
        }
    </script>
</body>
</html>
